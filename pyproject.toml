[project]
name = "phonopy-spectroscopy"
version = "0.1.0"
description = "Phonopy-Spectroscopy: A library for simulating vibrational spectroscopy"
authors = [
    { name = "Trace Bivens", email = "trace.bivens@example.com" }
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pandas",
    "h5py",
    "phonopy",
]
readme = "README.md"
license = { text = "BSD-3-Clause" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "lib"}
packages = ["spectroscopy"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
phonopy-spectroscopy = { path = ".", editable = true }

[tool.pixi.tasks]
ir-legacy = "python scripts/phonopy-ir"
raman-legacy = "python scripts/phonopy-raman"
test = "python -m unittest discover tests"
